# Default per-stage model picks. Copy this to <output>/.config/models.yaml at setup.
# Users override per-key after install.
#
# Image-size resolution order (first match wins, evaluated by
# scripts.lib.aspect.fal_image_size):
#   1. <stage>.image_size  — explicit per-stage override, set here or in
#      <output>/.config/models.yaml. Accepts either a fal preset string
#      ("portrait_16_9", "landscape_16_9", "square_hd", "portrait_hd",
#      "landscape_hd", "square") OR an object {width: N, height: N}.
#      Claude may rewrite this during a run if a specific shot needs a
#      different preset.
#   2. Model-based default — nano-banana / flux / imagen / ideogram get the
#      preset for brief.aspect; gpt-image-2 gets explicit {w,h}.
#   3. Fallback — landscape_16_9.
#
# `aspect_sizes` below is informational; the canonical sizing path is
# fal_image_size(). Setting `<stage>.image_size` overrides everything.

aspect_sizes:
  "16:9":
    storyboard_panel: 1920x1080    # one wide panel; slicer crops per beat
    per_keyframe:     1920x1080
  "9:16":
    storyboard_panel: 1080x1920
    per_keyframe:     1080x1920
  "1:1":
    storyboard_panel: 1080x1080
    per_keyframe:     1080x1080

storyboard_panel:
  model: fal-ai/gpt-image-2
  # image_size: portrait_16_9        # uncomment to override the default.
  # image_size: { width: 1536, height: 864 }   # explicit form also accepted.
  # Default behaviour: aspect-derived from brief.aspect:
  #   16:9 → {width:1536,height:864}; 9:16 → {width:864,height:1536}; 1:1 → {width:1024,height:1024}.

per_keyframe:
  model: fal-ai/nano-banana-2
  # image_size: portrait_hd          # uncomment to force a preset (e.g. when
  #                                    the aspect-derived preset doesn't suit).
  # Default: 16:9 → landscape_16_9; 9:16 → portrait_16_9; 1:1 → square_hd.

character_sheet:
  model: fal-ai/nano-banana-2
  # image_size: square_hd            # 1:1 by design — overridable here.
  size: 1024x1024                    # legacy hint (still respected if image_size absent)

video_i2v:
  model: fal-ai/bytedance/seedance/v1.5/pro/image-to-video
  default_duration_s: 5
  # Seedance accepts the keyframe's aspect; no size override needed.

vision_analysis:
  endpoint: fal-ai/any-llm
  provider: openrouter
  model: google/gemini-2.5-pro

vo:
  provider: elevenlabs
  default_voice_id: 21m00Tcm4TlvDq8ikWAM
  # ElevenLabs v3 — pinned. Required for multilingual phonemizing (Hinglish in
  # Devanagari, Tamil/Bengali in native scripts) and for audio-tag rendering.
  # Do NOT downgrade to multilingual_v2 / flash without first re-verifying that
  # Hinglish narration in Devanagari renders correctly.
  model_id: eleven_v3
  output_format: mp3_44100_192
