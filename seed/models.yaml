# Default per-stage model picks. Copy this to <output>/.config/models.yaml at setup.
# Users override per-key after install.
#
# Image-size resolution path (verified against fal.ai OpenAPI 2026-05-17):
# different models accept different parameter shapes — fal_image_payload()
# in scripts/lib/aspect.py emits the right shape per model and merges any
# overrides set here.
#
#   nano-banana-2  →  {aspect_ratio: "9:16", resolution: "2K"}
#                    NOT image_size — schema does not have that field.
#   gpt-image-2    →  {image_size: "portrait_16_9"} OR {image_size: {width, height}}
#   flux / imagen  →  {image_size: "portrait_16_9"} (preset enum only)
#   seedance i2v   →  {resolution: "720p" | "1080p"} (no image_size)
#
# Override precedence (highest first):
#   1. <stage>._payload — raw dict, spread verbatim into the fal payload.
#   2. <stage> keys matching the model's native shape (the ones below).
#   3. aspect-derived default from brief.aspect.

aspect_sizes:
  "16:9":
    storyboard_panel: 1920x1080    # one wide panel; slicer crops per beat
    per_keyframe:     1920x1080
  "9:16":
    storyboard_panel: 1080x1920
    per_keyframe:     1080x1920
  "1:1":
    storyboard_panel: 1080x1080
    per_keyframe:     1080x1080

storyboard_panel:
  model: fal-ai/gpt-image-2
  # image_size: portrait_16_9                  # preset string, OR
  # image_size: { width: 1536, height: 864 }   # explicit dims (multiples of 16, max 3840 edge).
  # Default (16:9): {width:1536,height:864}. 9:16 → {864,1536}. 1:1 → {1024,1024}.

per_keyframe:
  model: fal-ai/nano-banana-2
  # nano-banana-2 uses aspect_ratio + resolution. NOT image_size.
  # aspect_ratio: "9:16"           # enum: 21:9, 16:9, 3:2, 4:3, 5:4, 1:1, 4:5, 3:4, 2:3, 9:16, 4:1, 1:4, 8:1, 1:8, auto
  # resolution:   "2K"             # enum: 0.5K, 1K, 2K, 4K  (default 2K — higher fidelity)
  # If you switch the model to flux/imagen, use image_size instead:
  # image_size: portrait_16_9

character_sheet:
  model: fal-ai/gpt-image-2
  # gpt-image-2 handles the multi-region structured layout we want for sheets
  # (title + LEFT hero + CENTER/RIGHT TOP per-character expressions row +
  # turnaround + BOTTOM CENTER palette + BOTTOM MIDDLE expressions grid +
  # BOTTOM RIGHT details). Nano Banana 2 is great for single-subject
  # keyframes but struggles with the structured grid layout.
  # gpt-image-2 uses image_size (preset or {w,h}). Sheets are 16:9 landscape
  # by default so the LEFT hero + RIGHT character grid both have room.
  image_size: landscape_16_9
  quality: high
  # output_format: png  # default
  # background: "white" # studio sheet aesthetic; set transparent only if needed.

video_i2v:
  model: fal-ai/bytedance/seedance/v1.5/pro/image-to-video
  default_duration_s: 5
  # resolution: "1080p"            # enum: 480p, 720p, 1080p. Aspect inherited from keyframe.

vision_analysis:
  endpoint: fal-ai/openrouter/router/video   # video-native QA for clips
  provider: openrouter
  model: google/gemini-2.5-pro

vo:
  provider: elevenlabs
  default_voice_id: 21m00Tcm4TlvDq8ikWAM
  # ElevenLabs v3 — pinned. Required for multilingual phonemizing (Hinglish in
  # Devanagari, Tamil/Bengali in native scripts) and for audio-tag rendering.
  # Do NOT downgrade to multilingual_v2 / flash without re-verifying that
  # Hinglish narration in Devanagari renders correctly.
  model_id: eleven_v3
  output_format: mp3_44100_192

# ── Book mode (Phase B1–B3) ─────────────────────────────────────────────────
book:
  illustration:
    provider: fal
    model: fal-ai/gpt-image-2
    # Native gpt-image-2 outputs; book-print-prep upscales to A4P/A3L canvas.
    native_output_sizes:
      portrait: "1024x1456"      # 3:4 templates → A4P canvas
      landscape: "1456x1024"     # 16:9 templates → A3L canvas
  bg_removal:
    provider: fal
    model: fal-ai/birefnet/v2
  qa:
    provider: fal
    endpoint: fal-ai/any-llm/vision    # same path as VisualAnalyzer.analyse_keyframe
    model: google/gemini-2.5-pro
    threshold: 4                        # all 4 binary checks must pass
    max_retries: 2
  canvas:
    A4P: { width: 2480, height: 3508, dpi: 300 }    # 210×297mm @ 300 DPI
    A3L: { width: 4961, height: 3508, dpi: 300 }    # 420×297mm @ 300 DPI
