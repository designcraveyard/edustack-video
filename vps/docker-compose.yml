name: eduplugin

services:
  app:
    image: ghcr.io/designcraveyard/edustack-video-app:latest
    container_name: eduplugin-app
    restart: unless-stopped
    environment:
      EDUPLUGIN_DATA_DIR: /var/lib/eduplugin
      EDUPLUGIN_BIND: 0.0.0.0:8000
    volumes:
      - eduplugin-data:/var/lib/eduplugin
    expose:
      - "8000"

  caddy:
    image: ghcr.io/designcraveyard/edustack-video-caddy:latest
    container_name: eduplugin-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  eduplugin-data:
  caddy-data:
  caddy-config:
